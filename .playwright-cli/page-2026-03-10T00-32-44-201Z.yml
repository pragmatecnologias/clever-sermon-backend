          - group [ref=e830]:
            - generic "Passage Overview" [ref=e831] [cursor=pointer]
            - paragraph [ref=e832]: Pablo describe el estado previo de los creyentes como muertos en pecado y su transformación por la gracia divina, que los resucita con Cristo y los sitúa en los cielos. La salvación se presenta como un don de Dios, no por obras humanas, y los creyentes son creados para buenas obras.
          - group [ref=e833]:
            - generic "Literary Context" [ref=e834] [cursor=pointer]
            - paragraph [ref=e835]: El pasaje forma parte de la sección de doctrinas fundamentales (Efesios 1:15‑3:21) donde Pablo expone la unidad de los creyentes en Cristo y el propósito del evangelio. Se dirige a una comunidad que incluye judíos y gentiles, enfatizando la gracia como medio de reconciliación.
          - group [ref=e836]:
            - generic "Historical Context" [ref=e837] [cursor=pointer]
            - paragraph [ref=e838]: Pablo escribió esta epístola alrededor del 60‑62 d.C. a la iglesia de Éfeso, una comunidad que incluía judíos y gentiles en un contexto romano donde el paganismo y la filosofía helenística influyeron en la vida cotidiana.
          - group [ref=e839]:
            - generic "Canonical Context" [ref=e840] [cursor=pointer]
            - paragraph [ref=e841]: El pasaje continúa el relato de la redención iniciada en el Antiguo Testamento con la creación y caída, se cumple en Cristo (Nuevo Testamento) y apunta a la consumación futura cuando los creyentes están sentados en los cielos.
          - group [ref=e842]:
            - generic "Main Theological Claim" [ref=e843] [cursor=pointer]
            - paragraph [ref=e844]: La gracia de Dios, recibida por fe, transforma a los creyentes muertos en pecado en una nueva vida junto con Cristo, y los llama a vivir buenas obras como fruto de esa transformación.
          - group [ref=e845]:
            - generic "Exegetical Flow" [ref=e846] [cursor=pointer]
            - list [ref=e847]:
              - listitem [ref=e848]: Versículos 1‑3 presentan el estado de muerte espiritual y la vida mundana bajo la influencia del "príncipe del aire".
              - listitem [ref=e849]: "Versículos 4‑7 revelan el acto soberano de Dios: la gracia que resucita y eleva a los creyentes junto con Cristo."
              - listitem [ref=e850]: Versículos 8‑9 subrayan que la salvación es por gracia, mediante fe y no por obras.
              - listitem [ref=e851]: Versículo 10 concluye con la finalidad de las buenas obras como fruto y cumplimiento del plan divino.
          - group [ref=e852]:
            - generic "Exegetical Summary" [ref=e853] [cursor=pointer]
            - paragraph [ref=e854]: El texto muestra la progresión de la condición humana (muerte en pecado) a la vida transformada por la gracia de Dios, culminando en una nueva identidad creada para buenas obras.
